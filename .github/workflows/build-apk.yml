name: Build & Deploy APK

on:
  push:
    branches: [main]
    paths:
      - '血糖监测工具.html'
      - 'icon-*.png'
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-app
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release-signing.p12
            printf 'storeFile=keystore/release-signing.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Build APK
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Deploy APK to Pages
        run: |
          cd android-app
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          mkdir -p ../releases
          cp "$APK" ../releases/悦控糖.apk
          echo "APK copied to releases/悦控糖.apk"
          
      - name: Commit APK
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add releases/悦控糖.apk
          git commit -m "Auto-build APK $(date +%Y-%m-%d-%H%M)" || true
          git push
